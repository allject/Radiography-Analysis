        :root {
            --bg: #07111f;
            --panel: rgba(255, 255, 255, 0.08);
            --ink: #edf7ff;
            --muted: #a7b9cf;
            --accent: #34d5ff;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;

            padding: 32px;

        main {
            width: min(720px, 100%);

            border: 1px solid rgba(157, 211, 255, 0.18);
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);

        }
        img {
            width: 82px;
            height: 82px;
            border-radius: 22px;
            background: #fff;
            padding: 10px;
        }
        h1 {
            margin: 24px 0 10px;
            font-size: clamp(2rem, 6vw, 4rem);
            line-height: 1.02;
            letter-spacing: -0.04em;
        }
        p {
            margin: 0 auto;
            max-width: 520px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }
        a {
            display: inline-flex;
            margin-top: 24px;
            padding: 0.82rem 1rem;
            border: 1px solid rgba(52, 213, 255, 0.32);
            border-radius: 999px;
            color: var(--ink);
            background: rgba(52, 213, 255, 0.12);
